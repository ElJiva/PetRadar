version: '3.8'

services:
  # Base de Datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: incident_api_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - incident_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: incident_api_redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - incident_network

  # API NestJS (opcional, solo si quieres ejecutar desde Docker)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident_api_app
    ports:
      - "${PORT}:3000"
    environment:
      PORT: 3000
      MAILER_EMAIL: ${MAILER_EMAIL}
      MAILER_PASSWORD: ${MAILER_PASSWORD}
      MAILER_SERVICE: ${MAILER_SERVICE}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APPINSIGHTS_CONNECTION_STRING: ${APPINSIGHTS_CONNECTION_STRING}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - incident_network
    # Descomenta lo siguiente si quieres ejecutar desde Docker
    # command: npm run start:prod

volumes:
  postgres_data:
  redis_data:

networks:
  incident_network:
    driver: bridge
